name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.banco }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        banco: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agenda"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Testes com PGlite
        if: matrix.banco == 'pglite'
        run: npm test
      - name: Testes com PostgreSQL de verdade (mesmas migrações, RLS e constraint)
        if: matrix.banco == 'postgres'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agenda
        run: npm test

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_SKIP_TYPECHECK: "1"
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report
          retention-days: 7
